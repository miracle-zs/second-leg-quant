location = /ai-coin-selector { return 301 /ai-coin-selector/; }
location = /ai-coin-selector/ {
    proxy_pass http://127.0.0.1:18083/candidates;
    proxy_read_timeout 30s;
}
location = /ai-coin-selector/account/ {
    rewrite ^ /ai-coin-selector/account.html last;
}
location = /ai-coin-selector/account.html {
    internal;
    alias /var/www/ai-coin-selector/account.html;
    add_header Cache-Control "no-store" always;
    sub_filter_once off;
    sub_filter '<head>' '<head><base href="/ai-coin-selector/">';
    sub_filter 'href="index.html"' 'href="/ai-coin-selector/"';
    sub_filter 'href="account.html"' 'href="/ai-coin-selector/account/"';
    sub_filter 'href="reports/strategy_second_leg_playbook.html"' 'href="/ai-coin-selector/strategy/"';
}
location = /ai-coin-selector/strategy/ {
    rewrite ^ /ai-coin-selector/reports/strategy_second_leg_playbook.html last;
}
location = /ai-coin-selector/reports/strategy_second_leg_playbook.html {
    internal;
    alias /var/www/ai-coin-selector/reports/strategy_second_leg_playbook.html;
    sub_filter_once off;
    sub_filter 'href="../index.html"' 'href="/ai-coin-selector/"';
    sub_filter 'href="../account.html"' 'href="/ai-coin-selector/account/"';
    sub_filter 'href="strategy_second_leg_playbook.html"' 'href="/ai-coin-selector/strategy/"';
}
location = /ai-coin-selector/api/account {
    proxy_pass http://127.0.0.1:18083/account;
}
location = /ai-coin-selector/api/candidate-version {
    proxy_pass http://127.0.0.1:18083/candidate-version;
}
location ^~ /ai-coin-selector/ { return 404; }
