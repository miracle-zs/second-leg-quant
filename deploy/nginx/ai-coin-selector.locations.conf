# Rate-limit zone must be declared in http {} (e.g. /etc/nginx/nginx.conf), because
# Nginx forbids limit_req_zone inside server {} or location {} blocks:
#
#   limit_req_zone $binary_remote_addr zone=ai_coin_selector_binance:10m rate=30r/m;
#
# Once declared in http {}, uncomment limit_req / limit_req_status below if edge
# throttling is desired in addition to the backend per-IP limiter.

location = /ai-coin-selector {
    return 301 /ai-coin-selector/;
}

# Binance proxy routes: forward client IP headers for backend per-IP 429 limiting
# and pass through upstream security headers (X-Content-Type-Options, X-Frame-Options,
# Referrer-Policy, Content-Security-Policy) without proxy_hide_header or add_header overrides.
location /ai-coin-selector/api/binance/ {
    # limit_req zone=ai_coin_selector_binance burst=10 nodelay;
    # limit_req_status 429;
    proxy_pass http://127.0.0.1:18083/api/binance/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /ai-coin-selector/ {
    proxy_pass http://127.0.0.1:18083/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
